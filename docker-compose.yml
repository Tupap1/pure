services:
  pure-db:
    image: postgres:16-alpine
    container_name: pure_postgres_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pure_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pure_secure_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-pure_academic}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  pure-web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pure_user}:${POSTGRES_PASSWORD:-pure_secure_password_2026}@pure-db:5432/${POSTGRES_DB:-pure_academic}?sslmode=disable
      - NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL:-http://localhost:54321}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${NEXT_PUBLIC_SUPABASE_ANON_KEY:-demo_key}
      - FIREFLIES_API_KEY=${FIREFLIES_API_KEY:-}
    depends_on:
      - pure-db
    restart: unless-stopped

  pure-mcp:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    command: ["npx", "tsx", "mcp-server/index.ts"]
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - MCP_PORT=3001
      - MCP_API_KEY=${MCP_API_KEY:?MCP_API_KEY es obligatorio}
      - MCP_AUTH_TOKEN=${MCP_AUTH_TOKEN:-${MCP_API_KEY:?MCP_API_KEY es obligatorio}}
      - PUBLIC_MCP_URL=${PUBLIC_MCP_URL:-https://mcp.btw-one.com}
      - FIREFLIES_API_KEY=${FIREFLIES_API_KEY:-}
      - PURE_TZ=${PURE_TZ:-America/Bogota}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-pure_user}:${POSTGRES_PASSWORD:-pure_secure_password_2026}@pure-db:5432/${POSTGRES_DB:-pure_academic}?sslmode=disable
    stdin_open: true
    tty: true
    depends_on:
      - pure-db
    restart: unless-stopped

volumes:
  postgres_data:
